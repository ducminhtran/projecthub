<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Đăng nhập — ProjectHub</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',-apple-system,sans-serif;background:#f7f6f3;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border:1px solid rgba(55,53,47,.16);border-radius:12px;padding:48px 44px;width:100%;max-width:400px;box-shadow:0 8px 32px rgba(0,0,0,.06);animation:up .25s ease}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.logo{display:flex;align-items:center;gap:11px;margin-bottom:32px}
.logo-icon{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#2383e2,#5b9cf6);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(35,131,226,.3);flex-shrink:0}
.logo-text{font-size:17px;font-weight:700;letter-spacing:-.02em;color:#37352f}
h2{font-size:22px;font-weight:700;color:#37352f;margin-bottom:6px;letter-spacing:-.03em}
.sub{font-size:13.5px;color:rgba(55,53,47,.6);margin-bottom:28px;line-height:1.5}
.field{margin-bottom:14px}
label{display:block;font-size:11.5px;font-weight:600;color:rgba(55,53,47,.5);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.input-wrap{position:relative}
input{width:100%;padding:10px 12px;border:1px solid rgba(55,53,47,.2);border-radius:7px;font-size:14px;font-family:'DM Sans',sans-serif;color:#37352f;outline:none;transition:border .15s,box-shadow .15s}
input:focus{border-color:#2383e2;box-shadow:0 0 0 2px rgba(35,131,226,.12)}
.toggle-pass{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:rgba(55,53,47,.4);font-size:12px;padding:4px}
.btn{width:100%;padding:11px 16px;border:none;border-radius:8px;background:#2383e2;color:#fff;font-size:14px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;transition:background .12s;margin-top:4px}
.btn:hover{background:#1a73d1}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{margin-top:14px;padding:10px 14px;border-radius:7px;font-size:13px;display:none;align-items:center;gap:8px}
.msg.show{display:flex}
.msg.error{background:rgba(224,62,62,.08);color:#e03e3e}
.msg.ok{background:rgba(15,123,108,.08);color:#0f7b6c}
.msg.info{background:rgba(35,131,226,.08);color:#2383e2}
.spinner{width:15px;height:15px;border:2px solid rgba(35,131,226,.2);border-top-color:#2383e2;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{margin-top:24px;padding-top:18px;border-top:1px solid rgba(55,53,47,.09);font-size:11.5px;color:rgba(55,53,47,.35);text-align:center}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
        <path d="M12 2C7 2 3 6.5 3 10c0 1.5.5 3 1.5 4L3 18l3.5-1c1.5 1 3 1.5 5.5 1.5s4-.5 5.5-1.5L21 18l-1.5-4c1-1 1.5-2.5 1.5-4C21 6.5 17 2 12 2z"/>
        <circle cx="9" cy="10" r="1.2" fill="rgba(35,131,226,.6)"/>
        <circle cx="15" cy="10" r="1.2" fill="rgba(35,131,226,.6)"/>
      </svg>
    </div>
    <span class="logo-text">ProjectHub</span>
  </div>

  <h2>Đăng nhập</h2>
  <div class="sub">Nhập tài khoản được cấp bởi quản trị viên.</div>

  <div class="field">
    <label>Tên đăng nhập</label>
    <input type="text" id="inp-user" placeholder="ví dụ: ductm40"
      autocomplete="username"
      onkeydown="if(event.key==='Enter')document.getElementById('inp-pass').focus()"/>
  </div>

  <div class="field">
    <label>Mật khẩu</label>
    <div class="input-wrap">
      <input type="password" id="inp-pass" placeholder="Nhập mật khẩu"
        autocomplete="current-password"
        onkeydown="if(event.key==='Enter')doLogin()"/>
      <button class="toggle-pass" type="button" onclick="togglePass()">👁</button>
    </div>
  </div>

  <button class="btn" id="btn-login" onclick="doLogin()">Đăng nhập</button>

  <div class="msg error" id="msg-error">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 5v3M8 11h.01"/></svg>
    <span id="msg-error-text"></span>
  </div>
  <div class="msg ok" id="msg-ok">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M5 8l2.5 2.5L11 6"/></svg>
    <span>Đăng nhập thành công! Đang vào hệ thống...</span>
  </div>
  <div class="msg info" id="msg-loading">
    <div class="spinner"></div>
    <span>Đang xác thực...</span>
  </div>

  <div class="footer">Liên hệ quản trị viên nếu quên mật khẩu.</div>
</div>

<script>
var DATA_URL    = (window.APP_CONFIG && window.APP_CONFIG.DATA_URL)    || window.GAS_URL || '';
var SESSION_KEY = (window.APP_CONFIG && window.APP_CONFIG.SESSION_KEY) || 'ph_session';
var APP_URL     = (window.APP_CONFIG && window.APP_CONFIG.APP_URL)     || './index.html';

function showMsg(type, text) {
  ['error','ok','loading'].forEach(function(t) {
    document.getElementById('msg-'+t).classList.remove('show');
  });
  if (!type) return;
  document.getElementById('msg-'+type).classList.add('show');
  if (text && document.getElementById('msg-'+type+'-text')) {
    document.getElementById('msg-'+type+'-text').textContent = text;
  }
}

function togglePass() {
  var inp = document.getElementById('inp-pass');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}

// Hash password bằng SHA-256 (Web Crypto API)
async function hashPassword(password) {
  var encoder = new TextEncoder();
  var data    = encoder.encode(password);
  var hashBuf = await crypto.subtle.digest('SHA-256', data);
  var hashArr = Array.from(new Uint8Array(hashBuf));
  return hashArr.map(function(b) { return b.toString(16).padStart(2,'0'); }).join('');
}

var _logging = false;
async function doLogin() {
  if (_logging) return;

  var username = (document.getElementById('inp-user').value || '').trim().toLowerCase();
  var password = (document.getElementById('inp-pass').value || '').trim();

  if (!username) { showMsg('error', 'Vui lòng nhập tên đăng nhập'); return; }
  if (!password) { showMsg('error', 'Vui lòng nhập mật khẩu'); return; }
  if (!DATA_URL) { showMsg('error', 'Chưa cấu hình DATA_URL trong config.js'); return; }

  _logging = true;
  document.getElementById('btn-login').disabled = true;
  showMsg('loading');

  try {
    // Hash password trước khi gửi
    var passHash = await hashPassword(password);

    var url  = DATA_URL + '?action=login&username=' + encodeURIComponent(username) + '&pass=' + encodeURIComponent(passHash);
    var res  = await fetch(url, { redirect: 'follow', mode: 'cors' });
    var json = await res.json();

    if (json.ok) {
      var hours = (window.APP_CONFIG && window.APP_CONFIG.SESSION_HOURS) || 8;
      var session = {
        token:       json.token,
        email:       json.email,
        name:        json.name,
        username:    username,
        member_id:   json.member_id,
        position_id: json.position_id,
        permissions: json.permissions || {},
        expires_at:  Date.now() + (hours * 3600000),
      };
      localStorage.setItem(SESSION_KEY, JSON.stringify(session));
      showMsg('ok');
      setTimeout(function() { window.location.replace(APP_URL); }, 800);
    } else {
      showMsg('error', json.error === 'unauthorized' ? 'Tên đăng nhập hoặc mật khẩu không đúng' : (json.error || 'Đăng nhập thất bại'));
      document.getElementById('btn-login').disabled = false;
      _logging = false;
    }
  } catch(err) {
    showMsg('error', 'Lỗi kết nối: ' + err.message);
    document.getElementById('btn-login').disabled = false;
    _logging = false;
  }
}

// Init
(function() {
  try {
    var s = JSON.parse(localStorage.getItem(SESSION_KEY) || '{}');
    if (s.token && s.expires_at > Date.now()) {
      window.location.replace(APP_URL);
      return;
    }
  } catch(e) {}
  localStorage.removeItem(SESSION_KEY);
  setTimeout(function() { document.getElementById('inp-user').focus(); }, 100);
})();
</script>
</body>
</html>
