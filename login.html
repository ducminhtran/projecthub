<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Đăng nhập — ProjectHub</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',-apple-system,sans-serif;background:#f7f6f3;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border:1px solid rgba(55,53,47,.16);border-radius:12px;padding:48px 44px;width:100%;max-width:400px;box-shadow:0 8px 32px rgba(0,0,0,.06)}
.logo{display:flex;align-items:center;gap:11px;margin-bottom:32px}
.logo-icon{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#2383e2,#5b9cf6);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(35,131,226,.3)}
.logo-text{font-size:17px;font-weight:700;letter-spacing:-.02em;color:#37352f}
.heading{font-size:22px;font-weight:700;color:#37352f;margin-bottom:8px}
.sub{font-size:14px;color:rgba(55,53,47,.65);margin-bottom:28px;line-height:1.5}
.btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 16px;border:1px solid rgba(55,53,47,.16);border-radius:8px;background:#fff;color:#37352f;font-size:14px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;transition:background .12s}
.btn:hover{background:#f7f6f3}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{margin-top:14px;padding:10px 14px;border-radius:7px;font-size:13px;display:none}
.msg.show{display:block}
.msg.info{background:rgba(35,131,226,.08);color:#2383e2}
.msg.error{background:rgba(224,62,62,.08);color:#e03e3e}
.msg.ok{background:rgba(15,123,108,.08);color:#0f7b6c}
.footer{margin-top:24px;padding-top:18px;border-top:1px solid rgba(55,53,47,.09);font-size:12px;color:rgba(55,53,47,.4);text-align:center}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
        <path d="M12 2C7 2 3 6.5 3 10c0 1.5.5 3 1.5 4L3 18l3.5-1c1.5 1 3 1.5 5.5 1.5s4-.5 5.5-1.5L21 18l-1.5-4c1-1 1.5-2.5 1.5-4C21 6.5 17 2 12 2z"/>
      </svg>
    </div>
    <span class="logo-text">ProjectHub</span>
  </div>

  <div id="view-main">
    <div class="heading">Đăng nhập</div>
    <div class="sub">Sử dụng tài khoản Google được cấp quyền để truy cập.</div>

    <button class="btn" id="btn" onclick="doLogin()">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Đăng nhập với Google
    </button>

    <div class="msg info show" id="msg-info" style="display:none"></div>
    <div class="msg error" id="msg-error" style="display:none"></div>
    <div class="msg ok" id="msg-ok" style="display:none"></div>
  </div>

  <div id="view-denied" style="display:none;text-align:center;padding:8px 0">
    <div style="font-size:32px;margin-bottom:12px">🔒</div>
    <div style="font-size:15px;font-weight:600;margin-bottom:8px;color:#37352f">Không có quyền truy cập</div>
    <div style="font-size:13px;color:rgba(55,53,47,.65);margin-bottom:16px" id="denied-msg">Email chưa được cấp quyền.</div>
    <button class="btn" style="width:auto;padding:6px 16px" onclick="resetView()">Thử lại</button>
  </div>

  <div class="footer">Chỉ tài khoản được cấp quyền mới có thể đăng nhập.</div>
</div>

<script>
// ── CONFIG ────────────────────────────────────
const GAS_URL     = 'YOUR_GAS_URL'; // ← điền GAS_URL của bạn
const SESSION_KEY = 'ph_session';
const APP_URL     = './index.html';

// ── Helpers ───────────────────────────────────
function showMsg(type, text) {
  ['info','error','ok'].forEach(t => {
    document.getElementById('msg-'+t).style.display = 'none';
  });
  if (type) {
    var el = document.getElementById('msg-'+type);
    el.textContent = text || '';
    el.style.display = 'block';
  }
}

function resetView() {
  document.getElementById('view-main').style.display  = 'block';
  document.getElementById('view-denied').style.display = 'none';
  document.getElementById('btn').disabled = false;
  showMsg(null);
}

// ── Login: redirect TOÀN TRANG sang GAS ───────
var _clicking = false;
function doLogin() {
  if (_clicking) return;
  _clicking = true;

  if (!GAS_URL || GAS_URL === 'YOUR_GAS_URL') {
    showMsg('error', 'Chưa điền GAS_URL trong login.html');
    _clicking = false;
    return;
  }

  document.getElementById('btn').disabled = true;
  showMsg('info', 'Đang chuyển hướng đến Google...');

  var appUrl   = window.location.href.replace('login.html', 'index.html');
  var loginUrl = GAS_URL + '?action=login&redirect=' + encodeURIComponent(appUrl);

  // QUAN TRỌNG: redirect toàn trang, không dùng popup/iframe
  setTimeout(function() {
    window.location.replace(loginUrl);
  }, 200);
}

// ── Xử lý kết quả callback ────────────────────
function checkCallback() {
  var search = window.location.search;
  var params = new URLSearchParams(search);
  var error  = params.get('error');
  var email  = params.get('email');

  if (!error) return;

  // Xóa params khỏi URL
  history.replaceState({}, '', window.location.pathname);

  if (error === 'unauthorized') {
    document.getElementById('view-main').style.display  = 'none';
    document.getElementById('view-denied').style.display = 'block';
    document.getElementById('denied-msg').textContent =
      'Email ' + (email ? decodeURIComponent(email) : '') + ' chưa được cấp quyền.';
  } else {
    showMsg('error', 'Lỗi: ' + decodeURIComponent(error));
  }
}

// ── Init ─────────────────────────────────────
(function() {
  // Session còn hạn → vào app luôn
  try {
    var s = JSON.parse(localStorage.getItem(SESSION_KEY) || '{}');
    if (s.token && s.expires_at > Date.now()) {
      showMsg('ok', 'Đã đăng nhập. Đang chuyển hướng...');
      setTimeout(function() { window.location.replace(APP_URL); }, 400);
      return;
    }
  } catch(e) {}
  localStorage.removeItem(SESSION_KEY);

  // Kiểm tra callback error
  checkCallback();
})();
</script>
</body>
</html>
