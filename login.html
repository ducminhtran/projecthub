<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Đăng nhập — ProjectHub</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',-apple-system,sans-serif;background:#f7f6f3;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border:1px solid rgba(55,53,47,.16);border-radius:12px;padding:48px 44px;width:100%;max-width:400px;box-shadow:0 8px 32px rgba(0,0,0,.06);animation:up .25s ease}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.logo{display:flex;align-items:center;gap:11px;margin-bottom:32px}
.logo-icon{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#2383e2,#5b9cf6);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(35,131,226,.3);flex-shrink:0}
.logo-text{font-size:17px;font-weight:700;letter-spacing:-.02em;color:#37352f}
h2{font-size:22px;font-weight:700;color:#37352f;margin-bottom:6px;letter-spacing:-.03em}
.sub{font-size:13.5px;color:rgba(55,53,47,.6);margin-bottom:28px;line-height:1.5}
.btn-google{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 16px;border:1px solid rgba(55,53,47,.2);border-radius:8px;background:#fff;color:#37352f;font-size:14px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;transition:background .12s,box-shadow .12s}
.btn-google:hover{background:#f7f6f3;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.btn-google:disabled{opacity:.5;cursor:not-allowed}
.msg{margin-top:14px;padding:10px 14px;border-radius:7px;font-size:13px;display:none;align-items:center;gap:8px}
.msg.show{display:flex}
.msg.error{background:rgba(224,62,62,.08);color:#e03e3e}
.msg.ok{background:rgba(15,123,108,.08);color:#0f7b6c}
.msg.info{background:rgba(35,131,226,.08);color:#2383e2}
.spinner{width:15px;height:15px;border:2px solid rgba(35,131,226,.2);border-top-color:#2383e2;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{margin-top:24px;padding-top:18px;border-top:1px solid rgba(55,53,47,.09);font-size:11.5px;color:rgba(55,53,47,.35);text-align:center}
.denied{display:none;text-align:center;padding:8px 0}
.denied.show{display:block}
.retry{margin-top:14px;padding:7px 16px;border:1px solid rgba(55,53,47,.2);border-radius:7px;background:#fff;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
        <path d="M12 2C7 2 3 6.5 3 10c0 1.5.5 3 1.5 4L3 18l3.5-1c1.5 1 3 1.5 5.5 1.5s4-.5 5.5-1.5L21 18l-1.5-4c1-1 1.5-2.5 1.5-4C21 6.5 17 2 12 2z"/>
        <circle cx="9" cy="10" r="1.2" fill="rgba(35,131,226,.6)"/>
        <circle cx="15" cy="10" r="1.2" fill="rgba(35,131,226,.6)"/>
      </svg>
    </div>
    <span class="logo-text">ProjectHub</span>
  </div>

  <div id="view-login">
    <h2>Đăng nhập</h2>
    <div class="sub">Sử dụng tài khoản Google được cấp quyền để truy cập hệ thống.</div>

    <button class="btn-google" id="btn-login" onclick="openLoginPopup()">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Đăng nhập với Google
    </button>

    <div class="msg error" id="msg-error">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 5v3M8 11h.01"/></svg>
      <span id="msg-error-text"></span>
    </div>
    <div class="msg ok" id="msg-ok">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M5 8l2.5 2.5L11 6"/></svg>
      <span>Đăng nhập thành công! Đang vào hệ thống...</span>
    </div>
    <div class="msg info" id="msg-loading">
      <div class="spinner"></div>
      <span>Đang chờ xác thực Google...</span>
    </div>
  </div>

  <div class="denied" id="view-denied">
    <div style="font-size:32px;margin-bottom:12px">🔒</div>
    <div style="font-size:15px;font-weight:600;margin-bottom:8px;color:#37352f">Không có quyền truy cập</div>
    <div style="font-size:13px;color:rgba(55,53,47,.6);margin-bottom:4px" id="denied-email"></div>
    <div style="font-size:13px;color:rgba(55,53,47,.6)">Liên hệ quản trị viên để được cấp quyền.</div>
    <button class="retry" onclick="resetView()">Thử tài khoản khác</button>
  </div>

  <div class="footer">Chỉ tài khoản được quản trị viên cấp quyền mới có thể đăng nhập.</div>
</div>

<script>
var LOGIN_URL   = (window.APP_CONFIG && window.APP_CONFIG.LOGIN_URL) || window.LOGIN_URL || '';
var SESSION_KEY = (window.APP_CONFIG && window.APP_CONFIG.SESSION_KEY) || 'ph_session';
var APP_URL     = (window.APP_CONFIG && window.APP_CONFIG.APP_URL) || './index.html';
var _popup      = null;
var _pollTimer  = null;
var _logging    = false;

function showMsg(type, text) {
  ['error','ok','loading'].forEach(function(t) {
    document.getElementById('msg-'+t).classList.remove('show');
  });
  if (!type) return;
  document.getElementById('msg-'+type).classList.add('show');
  if (text && document.getElementById('msg-'+type+'-text')) {
    document.getElementById('msg-'+type+'-text').textContent = text;
  }
}

function resetView() {
  document.getElementById('view-login').style.display = 'block';
  document.getElementById('view-denied').classList.remove('show');
  document.getElementById('btn-login').disabled = false;
  _logging = false;
  showMsg(null);
  if (_popup && !_popup.closed) _popup.close();
  clearInterval(_pollTimer);
}

// ── Mở popup đăng nhập Google ────────────────
function openLoginPopup() {
  if (_logging) return;
  if (!LOGIN_URL) { showMsg('error', 'Chưa cấu hình LOGIN_URL trong config.js'); return; }

  _logging = true;
  document.getElementById('btn-login').disabled = true;
  showMsg('loading');

  var loginUrl = LOGIN_URL + '?action=login';
  var w = 520, h = 600;
  var left = Math.round((screen.width  - w) / 2);
  var top  = Math.round((screen.height - h) / 2);

  _popup = window.open(loginUrl, 'ph_login',
    'width='+w+',height='+h+',left='+left+',top='+top+',resizable=yes,scrollbars=yes');

  if (!_popup) {
    showMsg('error', 'Trình duyệt chặn popup. Vui lòng cho phép popup và thử lại.');
    resetView();
    return;
  }

  // Poll kiểm tra popup đóng mà chưa nhận được auth
  _pollTimer = setInterval(function() {
    if (_popup && _popup.closed) {
      clearInterval(_pollTimer);
      // Kiểm tra session đã được lưu chưa
      try {
        var s = JSON.parse(localStorage.getItem(SESSION_KEY) || '{}');
        if (s.token && s.expires_at > Date.now()) {
          showMsg('ok');
          setTimeout(function() { window.location.replace(APP_URL); }, 500);
          return;
        }
      } catch(e) {}
      // Popup đóng nhưng không có session
      if (_logging) {
        showMsg('error', 'Đăng nhập bị hủy. Vui lòng thử lại.');
        document.getElementById('btn-login').disabled = false;
        _logging = false;
      }
    }
  }, 500);
}

// ── Nhận session từ auth-callback.html qua BroadcastChannel ──
var _channel = new BroadcastChannel('ph_auth');
_channel.onmessage = function(event) {
  var data = event.data;
  if (!data || data.type !== 'ph_auth') return;

  clearInterval(_pollTimer);
  try { if (_popup && !_popup.closed) _popup.close(); } catch(e) {}
  _channel.close();

  if (data.ok) {
    showMsg('ok');
    setTimeout(function() { window.location.replace(APP_URL); }, 800);
  } else if (data.error === 'unauthorized') {
    document.getElementById('view-login').style.display = 'none';
    document.getElementById('view-denied').classList.add('show');
    document.getElementById('denied-email').textContent = data.email ? 'Email: ' + data.email : '';
    showMsg(null);
    _logging = false;
  } else {
    showMsg('error', data.error || 'Đăng nhập thất bại');
    document.getElementById('btn-login').disabled = false;
    _logging = false;
  }
};

// ── Init ─────────────────────────────────────
(function() {
  try {
    var s = JSON.parse(localStorage.getItem(SESSION_KEY) || '{}');
    if (s.token && s.expires_at > Date.now()) {
      showMsg('ok');
      setTimeout(function() { window.location.replace(APP_URL); }, 300);
      return;
    }
  } catch(e) {}
  localStorage.removeItem(SESSION_KEY);
})();
</script>
</body>
</html>
